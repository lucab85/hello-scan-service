name: Container CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build container image
        run: |
          docker build \
            --tag hello-service:${{ github.sha }} \
            .
      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hello-service:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL